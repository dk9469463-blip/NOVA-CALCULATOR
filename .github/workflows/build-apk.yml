name: Build NOVA Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        run: npm install

      - name: Prepare website files
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js www/
          cp -r icons www/

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
